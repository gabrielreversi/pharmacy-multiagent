[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "openai (>=3.28.0,<4.0.0)",
    "langchain-openai (>=1.7.0,<2.0.0)",
    "langchain (>=1.4.4,<2.0.0)",
    "laya (>=0.4.2,<0.5.0)",
    "torch (>=2.14.1,<3.0.0)",
    "transformers (>=5.19.0,<6.0.0)",
    "accelerate (>=1.15.0,<2.0.0)",
    "qdrant-client (>=1.19,<1.20)",
    "pymupdf4llm (>=1.28.2,<2.0.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "azure-storage-blob (>=12.31.0,<13.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
torch = [
    {version = "2.14.1", source = "pypi", markers = "sys_platform == 'darwin'"},
    {version = "2.14.1+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'"},
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
    "classifier: testes do classificador laya com o modelo real (lentos)",
]
